name: benchmark-round

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Named suite (one job per generator and cell, runs from suites.json); empty uses -nf/-cs/-mr below
        type: choice
        default: ""
        options: ["", smoke, standard, stress, P, M, G, GG]
      number_of_files:
        description: Number of posts per build (-nf)
        type: string
        default: "100"
      content_size:
        description: Size of each post in KB (-cs)
        type: choice
        default: "0.500"
        options: ["0.500", "5", "50", "500", "1000", "5000", "10000", "100000"]
      min_runs:
        description: Timed hyperfine runs per build (-mr)
        type: string
        default: "3"
      tests:
        description: Space-separated generator names; empty runs all
        type: string
        default: ""

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: list
        env:
          TESTS: ${{ inputs.tests }}
          SUITE: ${{ inputs.suite }}
          NF: ${{ inputs.number_of_files }}
          CS: ${{ inputs.content_size }}
          MR: ${{ inputs.min_runs }}
        run: |
          set -euo pipefail
          for v in NF MR; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then
              echo "$v must be a non-negative integer" >&2
              exit 1
            fi
          done
          if [ -n "${TESTS// /}" ]; then
            # read -ra splits on whitespace without glob expansion
            read -ra requested <<< "$TESTS"
            list=$(printf '%s\n' "${requested[@]}")
          else
            list=$(jq -r '.framework' frameworks/*/*/benchmark_config.json)
          fi
          if printf '%s\n' "$list" | grep -vqE '^[A-Za-z0-9_.-]+$'; then
            echo "invalid test name" >&2
            exit 1
          fi
          if [[ ! "$SUITE" =~ ^[A-Za-z0-9-]*$ ]]; then
            echo "invalid suite" >&2
            exit 1
          fi
          tests=$(printf '%s\n' "$list" | sort -u)
          if [ -n "$SUITE" ]; then
            # generator x cell matrix; each job runs one suite cell (--suite --cell)
            # with the suite's runs, cooldown and timeout from suites.json
            # shellcheck disable=SC2086
            matrix=$(python3 -m toolset.github_actions.suite_matrix --suite "$SUITE" --tests $tests)
          else
            matrix=$(printf '%s\n' "$tests" | jq -Rsc --arg nf "$NF" --arg cs "$CS" --arg mr "$MR" \
              'split("\n") | map(select(length > 0) | {test: ., suite: "", cell: 0, number_of_files: $nf, content_size: $cs, min_runs: $mr, timeout_minutes: 360, key: .})')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  run:
    needs: list
    runs-on: ubuntu-24.04
    # suite jobs: the suite's timeoutSeconds plus a margin (suite_matrix.py); ad hoc: 360
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run benchmark
        env:
          TEST: ${{ matrix.test }}
          SUITE: ${{ matrix.suite }}
          CELL: ${{ matrix.cell }}
          NF: ${{ matrix.number_of_files }}
          CS: ${{ matrix.content_size }}
          MR: ${{ matrix.min_runs }}
        run: |
          if [ -n "$SUITE" ]; then
            ./ssgberk --test "$TEST" --suite "$SUITE" --cell "$CELL"
          else
            ./ssgberk --test "$TEST" -nf "$NF" -cs "$CS" -mr "$MR"
          fi
      - name: Record runner environment
        if: always()
        env:
          TEST: ${{ matrix.test }}
          SUITE: ${{ matrix.suite }}
        run: |
          # a suite cell writes results/<ts>/<profile>/nf<nf>-cs<cs>/; ad hoc results/<ts>/
          if [ -n "$SUITE" ]; then
            R=$(ls -td results/*/*/nf*-cs*/ 2>/dev/null | head -1 || true)
          else
            R=$(ls -td results/*/ 2>/dev/null | head -1 || true)
          fi
          [ -n "$R" ] || exit 0
          # the container creates results/ as root
          sudo chown -R "$(id -u):$(id -g)" results
          {
            echo "## lscpu"; lscpu
            echo "## nproc"; nproc
            echo "## free -m"; free -m
            echo "## docker version"
            docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
            echo "## uname -a"; uname -a
          } > "${R}env-${TEST}.txt" 2>&1
          test -s "${R}env-${TEST}.txt" || { echo "env file missing" >&2; exit 1; }
          echo "RESULT_DIR=$R" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always() && env.RESULT_DIR != ''
        with:
          name: result-${{ matrix.key }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: artifacts
      - name: Merge results
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [ -n "$SUITE" ]; then
            # one results.json + summary per cell, plus suite-summary.csv/md
            python3 -m toolset.utils.merge_results --by-cell --out round artifacts/result-*/results.json
          else
            python3 -m toolset.utils.merge_results --out round artifacts/result-*/results.json
          fi
          mkdir -p round/runs
          for d in artifacts/result-*; do cp -r "$d" "round/runs/$(basename "$d")"; done
          if [ -n "$SUITE" ]; then
            cat round/suite-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat round/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-round
          path: round
